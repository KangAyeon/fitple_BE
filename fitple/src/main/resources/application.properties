spring.application.name=fitple
spring.config.import=optional:classpath:env.properties

# MySQL jung-bo
spring.datasource.url=jdbc:mysql://localhost:3306/fitple?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA jung-bo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

file.upload-dir=uploads

# Server jung-bo
server.port=8080
turnelKagamine="https://appropriations-server-seattle-order.trycloudflare.com/"

gemini.api-key=${GEMINI_API_KEY}
openai.api-key=${OPENAIKEYINNIDA}
openai.model=gpt-4o-mini